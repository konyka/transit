name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            generator: Unix Makefiles
          - os: ubuntu-latest
            cc: clang
            generator: Unix Makefiles
          - os: macos-latest
            cc: gcc
            generator: Unix Makefiles
          - os: macos-latest
            cc: clang
            generator: Unix Makefiles
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.16.x'
      
      - name: Configure
        # -Werror is always enabled via cmake/CompilerFlags.cmake
        run: cmake -B build -G "${{ matrix.generator }}" -DCMAKE_C_COMPILER=${{ matrix.cc }}
        env:
          CC: ${{ matrix.cc }}
      
      - name: Build
        run: cmake --build build --config Release -j
      
      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j
      
      - name: Run benchmarks
        working-directory: build
        run: ctest -L benchmark --output-on-failure
        continue-on-error: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # Do not pin "Visual Studio 17 2022": windows-latest is VS 2026
        # (generator "Visual Studio 18 2026") as of June 2026.
        run: cmake -B build -A x64 -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release -j -- "/flp:logfile=${{ github.workspace }}\msvc.log;verbosity=minimal"

      - name: Annotate MSVC errors
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'msvc.log'
          if (-not (Test-Path $log)) { Write-Host 'no msvc.log'; exit 0 }
          Select-String -Path $log -Pattern ' (error|warning) C[0-9]+' |
            Select-Object -First 40 |
            ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure -j --output-log ctest.log

      - name: Annotate ctest failures
        if: failure()
        shell: pwsh
        working-directory: build
        run: |
          foreach ($f in @('ctest.log', 'Testing/Temporary/LastTest.log')) {
            if (-not (Test-Path $f)) { continue }
            Select-String -Path $f -Pattern 'The following tests FAILED|Failed +#|Assertion failed|\[FAIL\]|t_run_all_tests' |
              Select-Object -First 50 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          }

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer:
          - name: asan
            option: ENABLE_ASAN
          - name: ubsan
            option: ENABLE_UBSAN
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure with ${{ matrix.sanitizer.name }}
        run: cmake -B build -D${{ matrix.sanitizer.option }}=ON
      
      - name: Build
        run: cmake --build build -j
      
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  release:
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Package
        run: |
          cd build
          cpack
      - uses: actions/upload-artifact@v4
        with:
          name: transit-release
          path: build/*.tar.gz
