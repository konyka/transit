name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            generator: Unix Makefiles
          - os: ubuntu-latest
            cc: clang
            generator: Unix Makefiles
          - os: macos-latest
            cc: gcc
            generator: Unix Makefiles
          - os: macos-latest
            cc: clang
            generator: Unix Makefiles
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.16.x'
      
      - name: Configure
        # -Werror is always enabled via cmake/CompilerFlags.cmake
        run: cmake -B build -G "${{ matrix.generator }}" -DCMAKE_C_COMPILER=${{ matrix.cc }}
        env:
          CC: ${{ matrix.cc }}
      
      - name: Build
        run: cmake --build build --config Release -j
      
      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j
      
      - name: Run benchmarks
        working-directory: build
        run: ctest -L benchmark --output-on-failure
        continue-on-error: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure -j

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer:
          - name: asan
            option: ENABLE_ASAN
          - name: ubsan
            option: ENABLE_UBSAN
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure with ${{ matrix.sanitizer.name }}
        run: cmake -B build -D${{ matrix.sanitizer.option }}=ON
      
      - name: Build
        run: cmake --build build -j
      
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  release:
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Package
        run: |
          cd build
          cpack
      - uses: actions/upload-artifact@v4
        with:
          name: transit-release
          path: build/*.tar.gz
